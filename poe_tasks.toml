[tool.poe.tasks]
clean = { help = "Remove cached files", script = "poethepoet.scripts:rm('./**/__pycache__', '.pytest_cache', '.ruff_cache')" }
show-environment = { help = "Show current environment", cmd = "dynaconf -i src.project_name.config.settings list" }

# Reads the tmp_env.json generated by _export-dynaconf-env and starts the container,
# passing each variable as a -e flag to docker run. Requires bash due to the use of mapfile and process substitution.
_docker-run-with-env.interpreter = "bash"
_docker-run-with-env.shell = '''
mapfile -t ENV_ARGS < <(
    jq -r '
        to_entries[]
        | ["-e", "\(.key)=\(.value | tostring)"]
        | .[]
    ' tmp_env.json
)
exec docker run -d -p "80:${port}" "${ENV_ARGS[@]}" "${image_name}:${image_tag}"
'''
_docker-run-with-env.args = [
    { name = "image_name", type = "string" },
    { name = "image_tag", default = "latest", type = "string" },
    { name = "port", default = "8000", type = "integer" }
]
# Exports the environment variables resolved by dynaconf to a temporary JSON file.
# Uses the project's configuration instance to ensure that all layers of .secrets.toml are applied correctly.
_export-dynaconf-env.shell = '''
# envvar_prefix=False faz o dynaconf absorver TODOS os env vars do host.
# Filtramos: vars internas do dynaconf (*_FOR_DYNACONF) e vars de sistema conhecidas.
ENV_FOR_DYNACONF="$env_name" \
uv run dynaconf -i src.project_name.config.settings list --env "$env_name" --json \
| jq 'with_entries(select(
    (.key | endswith("_FOR_DYNACONF") | not) and
    (.key | IN(
        "PATH","HOME","USER","SHELL","TERM","TERM_PROGRAM","TERM_PROGRAM_VERSION",
        "VIRTUAL_ENV","VIRTUAL_ENV_PROMPT","OLDPWD","PWD","_","SHLVL","LOGNAME",
        "MAIL","LANG","LC_ALL","LC_CTYPE","HISTSIZE","HISTCONTROL","HISTFILESIZE",
        "DISPLAY","XTERM","COLORTERM","XDG_RUNTIME_DIR","DBUS_SESSION_BUS_ADDRESS",
        "SSH_AUTH_SOCK","TMPDIR","PS1","PS2","MANPATH","INFOPATH","UV_PYTHON",
        "CONDA_DEFAULT_ENV","CONDA_PREFIX","NVM_DIR","JAVA_HOME","GOPATH","GOROOT"
    ) | not)
))' > tmp_env.json
'''
_export-dynaconf-env.args = [
    { name = "env_name", default = "development", type = "string" }
]

[tool.poe.tasks.init]
help = "Initialize project configuration"
sequence = [
    "uv sync --all-packages",
    "prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push",
]
default_item_type = "cmd"

[tool.poe.groups.development]
heading = "Tasks related to development"

    [tool.poe.groups.development.tasks.commit]
    help = "Commit using conventional commit pattern"
    cmd = "cz c"

    [tool.poe.groups.development.tasks.lint]
    help = "Analyse code syntax and type errors"
    parallel = [
        { cmd = "ty check --output-format concise" },
        { cmd = "ruff check --output-format grouped" }
    ]

    [tool.poe.groups.development.tasks.format]
    help = "Format code trying to fix syntax and type errors"
    sequence = [
        "ruff format",
        "ruff check --fix --output-format grouped",
        "ty check --fix "
    ]
    default_item_type = "cmd"

    [tool.poe.groups.development.tasks.test]
    help = "Run automated tests"
    cmd = "pytest -v -m $mode"
    args = [
        { name = "mode", help = "Type of automated test to run", default = "unit", choices = ['unit', 'integration'] }
    ]
    
    [tool.poe.groups.deploy.tasks.build]
    help = "Create the application's container image"
    cmd = "docker build -t $image_name:$image_tag ."
    args = [
        { name = "image_name", help = "Image name", type = "string" },
        { name = "image_tag", help = "Image tag", default = "latest" , type = "string" }
    ]

[tool.poe.groups.validation]
heading = "Tasks related to validation"
    
    [tool.poe.groups.validation.tasks.validate-hooks]
    help = "Validate git hooks file"
    cmd = "prek validate-config prek.toml"

    [tool.poe.groups.validation.tasks.validate-commit]
    help = "Check if a commit message matches the conventional commits pattern"
    cmd ='cz check -m "$message"'
    args = [
        { name = "message", help = "Commit message to check", type = "string" }
    ]

[tool.poe.groups.pipeline]
heading = "Tasks related to processing pipelines"
    
    [tool.poe.groups.pipeline.tasks.run-pipeline]
    help = "Run the data processing pipeline"
    cmd = "python src/project_name/pipeline/main.py --config $config_file"
    args = [
        { name = "config_file", help = "Path to the pipeline configuration file", type = "string" }
    ]

[tool.poe.groups.deploy]
heading = "Deploy related tasks"
    
    [tool.poe.groups.deploy.tasks.bump]
    help = "Bump project version into git tags"
    cmd = "cz bump"

    [tool.poe.groups.deploy.tasks.check-tags]
    help = "Check all project's git tags bumped versions"
    cmd = "git tag --list"

    [tool.poe.groups.deploy.tasks.run]
    help = "Run the all containers from the application"
    cmd = "docker compose up -d"

    [tool.poe.groups.deploy.tasks.kill]
    help = "Stop the all containers from the application"
    cmd = "docker compose down"


[tool.poe.groups.serve]
heading = "Tasks related to API serving"

    [tool.poe.groups.serve.tasks.serve-debug]
    help = "Run API on debug mode"
    cmd = "fastapi dev"

    [tool.poe.groups.serve.tasks.serve-local]
    help = "Run the API locally"
    cmd = "fastapi prod --port ${port}"
    args = [
        { name = "port", help = "API port to run", default = "8000", type = "integer"}
    ]

    [tool.poe.groups.serve.tasks.serve-prod]
    help = "Run the API inside a container"
    sequence = [
        "build --image-name ${image-name} --image-tag ${image-tag}",
        "_export-dynaconf-env --env_name ${env_name}",
        "_docker-run-with-env --image_name ${image_name} --image_tag ${image_tag} --port ${port}",
        { cmd = "rm -f tmp_env.json" }
    ]
    args = [
        { name = "image-name", help = "Docker image's name", default = "project_api" , type = "string" },
        { name = "image-tag", help = "Docker image's tag", default = "latest" , type = "string" },
        { name = "env-name", help = "Environment to run (development, stagging, production)", default = "development", type = "string" },
        { name = "port", help = "API port to run", default = "8000", type = "integer" }
    ]