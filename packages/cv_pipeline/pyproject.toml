[project]
name = "cv_pipeline"
version = "0.1.0"
description = "A pipeline that tailors resumes to job openings using LLMs."
readme = "README.md"
dependencies = [
    "dspy>=3.3.1",
    "pdfplumber>=0.11.9",
    "prefect>=3.8.5",
    "rendercv[full]>=2.8",
]

[project.scripts]
cv_pipeline = "avoda_loop.pipeline:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ['./src/avoda_loop']

[tool.ruff]
extend = '../../pyproject.toml'