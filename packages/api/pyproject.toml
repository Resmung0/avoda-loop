[project]
name = "api"
version = "0.1.0"
description = "API to trigger pipelines and manage data."
readme = "README.md"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "fastcrud>=0.22.3",
    "orjson>=3.12.0",
    "pydantic-extra-types[all]>=2.11.1",
    "sqlmodel>=0.0.42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ['./src/avoda_loop']

[tool.ruff]
extend = '../../pyproject.toml'

[tool.fastapi]
entrypoint = "api.main:app"